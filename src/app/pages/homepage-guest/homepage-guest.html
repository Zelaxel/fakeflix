<main class="container">
    <img id="logo" src="logo.png">
    <h1> Netflix, but fake</h1>
    <form (submit)="goToLogin(emailInput.value)">
        <input
            class="form-field form-input"
            id="email-field"
            type="email"
            name="email"
            placeholder="Email Address"
            aria-label="Email Address"
            required
            #emailInput
        >

        <input
            class="form-field form-submit hoverable"
            id="submit"
            type="submit"
            value="Get Started"
        >
    </form>
</main>
