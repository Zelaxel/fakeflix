<main>
    <h1>Edit profile</h1>
    <form (ngSubmit)="changeProfile(inputText.value)">
        <img src="user_picture.jpg">
        <input class="form-input" type="text" value="{{name}}" required #inputText>
        <button type="submit" class="btn hoverable bouncy confirm">Confirm changes</button>
        <button type="button" class="btn hoverable bouncy cancel" (click)="goBack()">Cancel</button>
    </form>
</main>
