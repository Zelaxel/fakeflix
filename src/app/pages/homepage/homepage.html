<app-header></app-header>
<main class="header-page">
    <section id="featured">
        <article class="container" id="featured-info">
            <h1>{{featuredTitle()?.name}}</h1>
            <p>{{featuredTitle()?.description}}</p>

            <div id="featured-buttons">
                <a class="btn hoverable" id="watch-now" routerLink="">Watch now</a>
                <a class="btn hoverable" id="more-info" routerLink="/details" [state]="{data: featuredTitle()}"> More info</a>
            </div>
        </article>
        <img id="featured-thumbnail" src="{{featuredTitle()?.imageUrl}}">
    </section>

    <section id="popular-section">
        <p id="label">Popular</p>
        <div class="container" id="title-list">
            <button class="hoverable" (click)="scrollCarouselLeft()">
                <i class="bi bi-arrow-left-circle-fill"></i>
            </button>

            <section id="popular-items" #carousel>
              @for (item of popularTitles(); track item.id) {
                <app-title-item [title]="item"/>
              }
            </section>

            <button class="hoverable" (click)="scrollCarouselRight()">
                <i class="bi bi-arrow-right-circle-fill"></i>
            </button>
        </div>
    </section>
</main>
