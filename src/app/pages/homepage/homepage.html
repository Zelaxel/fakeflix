<app-header></app-header>
<main class="header-page">
    <section id="featured">
        <article class="container" id="featured-info">
            <h1>{{featuredTitle}}</h1>
            <p>{{featuredDescription}}</p>

            <div id="featured-buttons">
                <a class="btn hoverable" id="watch-now" href="">Watch now</a>
                <a class="btn hoverable" id="more-info" href="">More info</a>
            </div>
        </article>
        <img id="featured-thumbnail" src="imgs/thumbnail_placeholder.jpg">
    </section>
    
    <section id="popular-section">
        <p id="label">Popular</p>
        <div class="container" id="title-list">
            <button class="hoverable">
                <i class="bi bi-arrow-left-circle-fill"></i>
            </button>

            <section id="popular-items"></section>

            <button class="hoverable">
                <i class="bi bi-arrow-right-circle-fill"></i>
            </button>
        </div>
    </section>
</main>
