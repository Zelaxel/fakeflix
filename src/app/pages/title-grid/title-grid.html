<app-header></app-header>

<main class="header-page">
    <p id="title-grid-message-query">Showing: <strong id="title-grid-query">{{showing}}</strong></p>
    <section id="title-grid">
        @for(item of titles(); track item.id) {
            <div class="title-container">
                <app-title-item [title] = item></app-title-item>
            </div>
        }
    </section>
</main>
