<app-header></app-header>

<main class="container">
    <aside>
        <section class="container" id="aside-head">
            <button class="hoverable" id="back"><i class="bi bi-arrow-left"></i></button>
            <h1>{{title}}</h1>
        </section>
        <p>{{description}}</p>
    </aside>

    <section class="container" id="video-display">
        <h2>{{videoTitle}}</h2>
        <video
            autoplay muted loop
            src="/src/assets/videos/{{video}}"
            poster="imgs/{{thumbnail}}">
        </video>
            <a class="container hoverable" id="play-button"><i class="bi bi-play-fill"></i></a>
    </section>
</main>
