<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit profile</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body class="edit-body form-body">
    <h1 class="form-h1">Edit profile</h1>
    <div class="form-container">
        <form id="edit-form" action="./index.html">
            <input id="form-image" type="file" name="image" accept="image/*">
            <label for="form-image">
                <img id="profile-picture-edit" class="container profile-picture" src="/imgs/user_picture.jpg" alt="Error">
            </label>
            <input id="user-name-edit" class="form-input form-field" type="text" name="user-name" value="{{user name}}" required>
            <input class="form-submit form-field" type="submit" value="Confirm changes">
            <button id="cancel-edit-button" class="cancel-button" onclick="history.back()">Cancel</button>
        </form>
    </div>
    <script src="../js/check_sesion.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/edit_page.js"></script>
</body>
</html>
