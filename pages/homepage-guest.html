<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fakeflix</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body class="form-body">

    <main class="container homepage-guest">
        <img class="logo" src="/imgs/logo.png">
        <h1 class="form-h1">Netflix, but fake</h1>
        <div class="form-container">
            <form class="get-started-form" action="signin.html" method = "GET">
                <input
                        class="form-input form-field"
                        type="email"
                        name="email"
                        placeholder="Email Address"
                        aria-label="Email Address"
                        required
                >
                <input
                        class="form-submit form-field"
                        type="submit"
                        value="Get Started"
                >
            </form>
        </div>
    </main>

</body>
</html>
