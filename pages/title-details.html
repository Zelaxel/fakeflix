<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Fakeflix</title>
        <link rel="stylesheet" href="../styles.css">
    </head>

    <body class="details-body">
        <header id="header"></header>

        <main class="container header-page" id="details-page">
            <section id="details-container">
                <header class="details-header">
                    <button class="back-button" onclick="history.back()">Back</button>
                    <h1>{{title}}</h1>
                </header>
                <p>{{description}}</p>
                <section id="seasons">
                    <h2>Seasons</h2>
                    <div class="season-list"></div>
                </section>
            </section>
            <aside id="video-container">
                <h2 id="content-title">{{title}}</h2>
                <video id="video-preview" autoplay muted loop src="../videos/{{video}}" poster="../imgs/{{image}}"></video>
                <a class="play-button" id="play" href="video_player.html?v={{video}}">Play</a>
            </aside>
        </main>

        <script src="../js/common.js"></script>
        <script src="../js/details.js"></script>
        <script src="../js/header.js"></script>
    </body>
</html>
