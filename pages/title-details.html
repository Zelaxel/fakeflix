<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Fakeflix</title>
        <link rel="stylesheet" href="../styles.css">
    </head>

    <body class="details-body">
        <header id="header"></header>

        <main class="container header-page" id="details-page">
            <article id="details-container">
                <div class="details-header">
                    <button class="back-button" onclick="history.back()">Back</button>
                    <h1>{{title}}</h1>
                </div>
                <p>{{description}}</p>
                <section id="seasons">
                    <h2>Seasons</h2>
                    <div class="season-list"></div>
                </section>
            </article>
            <article id="video-container">
                <video id="video-preview" autoplay muted loop src="../videos/video" poster="{{image}}"></video>
                <button class="play-button">Play</button>
            </article>
        </main>

        <script src="../js/common.js"></script>
        <script src="../js/details.js"></script>
        <script src="../js/search.js"></script>
    </body>
</html>
