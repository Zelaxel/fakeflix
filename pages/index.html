<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Fakeflix</title>
        <link rel="stylesheet" href="../styles.css">
    </head>

    <body>
        <header id="header"></header>

        <main class="container section header-page" id="homepage">
                <section class="floating-section" id="recommended">
                    <div class="floating-content" id="recommended-info">
                        <h1>{{title}}</h1>
                        <p>{{description}}</p>
                        <div class="container recommended-buttons">
                            <a id="watch-now">Watch now</a>
                            <a id="more-info" href="/pages/title-details.html?id={{id}}">More info</a>
                        </div>
                    </div>
                    <img src="{{image}}" class="floating-image">
                </section>
                
                <section class="container section" id="popular">
                    <p class="label">Popular</p>
                    <div class="container title-list">
                        <button class="list-button"> < </button>

                        <div class="container" id="title-list-items"></div>

                        <button id="left-list-button" class="list-button"> > </button>
                    </div>
                </section>
        </main>

        <script src="../js/common.js"></script>
        <script src="../js/home.js"></script>
        <script src="../js/header.js"></script>
    </body>
</html>
