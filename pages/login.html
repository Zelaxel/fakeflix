<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Fakeflix</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body class="form-body">
    <h1 class="form-h1">Log in</h1>
    <div class="form-container">
            <form>
            <input class="form-input form-field" type="email" placeholder="Mail address" name="mail" required>
            <input class="form-input form-field" type="password" placeholder="Password" name="password" required>
            <input class="form-submit form-field" type="submit" value="Log in">
        </form>
        <p class="form-message">Don't have an account? <a class="form-link" href="signin.html">Sign in!</a></p>
    </div>
</body>
