<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Fakeflix</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body class="form-body">
    <h1 class="form-h1">Sign in</h1>
    <div class="form-container">
        <form>
            <input class="form-input form-field" type="text" placeholder="User name" name="user-name" required>
            <input class="form-input form-field" type="email" placeholder="Mail address" name="email" id="signinEmail" required>
            <input class="form-input form-field" type="password" placeholder="Password" name="password" required>
            <input class="form-input form-field" type="password" placeholder="Repeat password" name="repeated-password" required>
            <input class="form-submit form-field" type="submit" value="Sign in">
        </form>
        <p class="form-message">Have already an account? <a class="form-link" href="login.html">Log in!</a></p>
    </div>
    <script src="/js/login.js"></script>
    <script src="/js/login_link.js"></script>
</body>
</html>
